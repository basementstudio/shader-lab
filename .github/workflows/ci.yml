name: CI

on:
  pull_request:
    branches:
      - main
      - git-chad/shader-lab-v3-plan
      - git-chad/v3-*
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check package
        run: bun run --cwd packages/shader-lab-react typecheck

      - name: Type check MCP package
        run: bun run --cwd packages/shader-lab-mcp typecheck

      - name: Check MCP shader reference snapshot is current
        run: |
          bun run --cwd packages/shader-lab-mcp generate
          git diff --exit-code packages/shader-lab-mcp/src/lib/shader-reference-data.ts

      - name: Build package
        run: bun run --cwd packages/shader-lab-react build

      - name: Lint app
        run: bun run lint

      - name: Type check app
        run: bun run typecheck:tsc

      - name: Ensure changeset exists for PR changes
        if: github.event_name == 'pull_request'
        run: bunx changeset status --since=origin/${{ github.base_ref }}

  composition:
    # Linux Chromium/SwiftShader currently drops its GPU instance during these
    # texture-backed shader compilations. Keep the full GPU checks on macOS.
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run test:composition
      - name: Upload rendered compositions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-actuals
          path: .context/composition-test/
          if-no-files-found: ignore
